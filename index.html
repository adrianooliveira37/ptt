<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radio PTT - Teste</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    body { font-family: Arial; margin: 20px; background: #111; color: #0f0; }
    input, button { padding: 10px; margin: 5px; }
    button { background: #0f0; color: black; font-weight: bold; }
    .online { color: lime; }
    .call-btn { background: red; color: white; padding: 15px; font-size: 18px; }
  </style>
</head>
<body>
  <h1>🚀 Radio PTT - Teste</h1>

  <div id="loginScreen">
    <h2>Login</h2>
    <input id="userId" placeholder="User ID (ex: admin)" value="admin"><br>
    <input id="password" type="password" placeholder="Senha" value="123456"><br><br>
    <button onclick="login()">Entrar</button>
  </div>

  <div id="mainScreen" style="display:none;">
    <h2>Bem-vindo, <span id="userName"></span></h2>
    <button onclick="logout()">Sair</button>

    <h3>Adicionar Contato</h3>
    <input id="contactName" placeholder="Nome do contato">
    <input id="contactId" placeholder="ID do usuário">
    <button onclick="addContact()">Adicionar</button>

    <h3>Contatos</h3>
    <ul id="contactsList"></ul>

    <h3>Online agora</h3>
    <ul id="onlineList"></ul>
  </div>

  <script>
    let socket, peer, myToken, myUserId, currentCall = null;

    async function login() {
      const userId = document.getElementById('userId').value;
      const password = document.getElementById('password').value;

      const res = await fetch('http://192.168.88.57:3000/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId, password })
      });

      const data = await res.json();
      if (!data.success) {
        alert(data.error || 'Erro no login');
        return;
      }

      myToken = data.token;
      myUserId = userId;
      document.getElementById('userName').textContent = data.user.name;
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('mainScreen').style.display = 'block';

      initSocket();
      initPeer();
      loadContacts();
    }

    function initSocket() {
      socket = io('http://192.168.88.57:3000');

      socket.on('connect', () => {
        console.log('Socket conectado');
      });

      socket.on('presence', (onlinePeers) => {
        updateOnlineList(onlinePeers);
      });

      socket.on('auth_error', (msg) => alert(msg));
    }

    function initPeer() {
      peer = new Peer(undefined, {
        host: '192.168.88.57',
        port: 3000,
        path: '/peerjs',
        debug: 3
      });

      peer.on('open', (id) => {
        console.log('Meu Peer ID:', id);
        socket.emit('register', { peerId: id, token: myToken });
      });

      peer.on('call', (call) => {
        if (confirm('Chamada recebida! Atender?')) {
          call.answer(); // Aqui você pode passar stream se quiser áudio bidirecional
          currentCall = call;
          handleCall(call);
        }
      });
    }

    async function loadContacts() {
      const res = await fetch(`http://192.168.88.57:3000/contacts?ownerId=${myUserId}`, {
        headers: { Authorization: `Bearer ${myToken}` }
      });
      const contacts = await res.json();
      renderContacts(contacts);
    }

    function renderContacts(contacts) {
      const list = document.getElementById('contactsList');
      list.innerHTML = '';
      contacts.forEach(contact => {
        const li = document.createElement('li');
        li.innerHTML = `
          ${contact.name} (${contact.id})
          <button class="call-btn" onclick="startCall('${contact.id}')">PTT</button>
        `;
        list.appendChild(li);
      });
    }

    function updateOnlineList(onlinePeers) {
      // Por enquanto só mostra quantos estão online
      document.getElementById('onlineList').innerHTML = `<li class="online">${onlinePeers.length} usuários online</li>`;
    }

    async function addContact() {
      const name = document.getElementById('contactName').value;
      const id = document.getElementById('contactId').value;

      await fetch('http://192.168.88.57:3000/contacts', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${myToken}`
        },
        body: JSON.stringify({ name, id })
      });

      loadContacts();
    }

    function startCall(targetPeerId) {
      // Aqui vamos simplificar: só envia áudio enquanto o botão estiver pressionado (PTT)
      alert(`Iniciando chamada PTT para ${targetPeerId}\n\n(Ainda simplificado)`);
      // Vamos melhorar essa parte na próxima versão
    }

    function logout() {
      location.reload();
    }
  </script>
</body>
</html>
