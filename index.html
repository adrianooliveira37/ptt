<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radio PTT</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #111; color: #0f0; }
    input, button { padding: 12px; margin: 8px 0; width: 100%; max-width: 400px; }
    button { background: #0f0; color: black; font-weight: bold; border: none; cursor: pointer; }
    .call-btn { background: #f00; color: white; padding: 18px; font-size: 20px; }
    .online { color: lime; }
  </style>
</head>
<body>
  <h1>🚀 Radio PTT</h1>

  <div id="loginScreen">
    <h2>Login</h2>
    <input id="userId" placeholder="User ID" value="admin"><br>
    <input id="password" type="password" placeholder="Senha" value="123456"><br><br>
    <button onclick="login()">Entrar</button>
  </div>

  <div id="mainScreen" style="display:none;">
    <h2>Bem-vindo, <span id="userName"></span></h2>
    <button onclick="logout()">Sair</button>

    <h3>Adicionar Contato</h3>
    <input id="contactName" placeholder="Nome">
    <input id="contactId" placeholder="ID do usuário (ex: user1)">
    <button onclick="addContact()">Adicionar Contato</button>

    <h3>Meus Contatos</h3>
    <ul id="contactsList"></ul>

    <h3>Online: <span id="onlineCount">0</span></h3>
  </div>

  <script>
    const BASE_URL = 'https://ptt-1-zfyj.onrender.com';
    let socket, peer, myToken, myUserId;

    async function login() {
      const userId = document.getElementById('userId').value;
      const password = document.getElementById('password').value;

      const res = await fetch(`${BASE_URL}/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId, password })
      });

      const data = await res.json();
      if (!data.success) {
        alert(data.error || 'Erro ao fazer login');
        return;
      }

      myToken = data.token;
      myUserId = userId;
      document.getElementById('userName').textContent = data.user.name;
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('mainScreen').style.display = 'block';

      initSocket();
      initPeer();
      loadContacts();
    }

    function initSocket() {
      socket = io(BASE_URL);

      socket.on('presence', (onlinePeers) => {
        document.getElementById('onlineCount').textContent = onlinePeers.length;
      });
    }

    function initPeer() {
      peer = new Peer(undefined, {
        host: 'ptt-1-zfyj.onrender.com',
        port: 443,           // HTTPS
        path: '/peerjs',
        secure: true,
        debug: 2
      });

      peer.on('open', (id) => {
        console.log('✅ Peer ID:', id);
        socket.emit('register', { peerId: id, token: myToken });
      });

      peer.on('error', (err) => console.error('Peer error:', err));
    }

    async function loadContacts() {
      const res = await fetch(`${BASE_URL}/contacts`, {
        headers: { Authorization: `Bearer ${myToken}` }
      });
      const contacts = await res.json();
      renderContacts(contacts);
    }

    function renderContacts(contacts) {
      const list = document.getElementById('contactsList');
      list.innerHTML = '';
      contacts.forEach(c => {
        const li = document.createElement('li');
        li.innerHTML = `${c.name} (${c.id}) 
          <button class="call-btn" onclick="startCall('${c.id}')">PTT</button>`;
        list.appendChild(li);
      });
    }

    async function addContact() {
      const name = document.getElementById('contactName').value;
      const id = document.getElementById('contactId').value;

      if (!name || !id) return alert("Preencha nome e ID");

      await fetch(`${BASE_URL}/contacts`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${myToken}`
        },
        body: JSON.stringify({ name, id })
      });

      loadContacts();
    }

    function startCall(targetId) {
      alert(`Tentando PTT para ${targetId}...\n\n(Ainda vamos implementar o áudio real na próxima etapa)`);
    }

    function logout() {
      location.reload();
    }
  </script>
</body>
</html>
