<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radio PTT</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #111; color: #0f0; text-align: center; }
    button { padding: 12px 20px; margin: 8px; font-size: 16px; border-radius: 8px; cursor: pointer; }
    .ptt-btn {
      background: #ff0000;
      color: white;
      font-size: 26px;
      padding: 40px;
      border-radius: 50%;
      width: 220px;
      height: 220px;
      margin: 30px auto;
      display: block;
    }
    .ptt-btn:active { background: #aa0000; transform: scale(0.95); }
    li { margin: 15px 0; font-size: 18px; }
  </style>
</head>
<body>
  <h1>🚀 Radio PTT</h1>

  <div id="mainScreen">
    <h2>Bem-vindo, <span id="userName"></span></h2>
    <p id="status" style="color:yellow;">Status: Conectando...</p>

    <h3>Adicionar Contato</h3>
    <input id="contactName" placeholder="Nome" style="width:200px">
    <input id="contactId" placeholder="ID (ex: adriano)" style="width:200px">
    <button onclick="addContact()">Adicionar</button>

    <h3>Meus Contatos</h3>
    <ul id="contactsList" style="list-style:none; padding:0;"></ul>

    <h3>Online: <span id="onlineCount">0</span></h3>
  </div>

  <script>
    const BASE_URL = 'https://ptt-1-zfyj.onrender.com';
    let socket, peer, myToken, myUserId, myPeerId, localStream = null;

    // Pega o token e userId do login (vamos simplificar)
    async function initApp() {
      // Tenta pegar dados do login (você pode melhorar depois)
      myToken = "seu-token-aqui"; // temporário
      myUserId = document.getElementById('userName').textContent || "admin";

      initSocket();
      await initPeer();
      await loadContacts();
    }

    function initSocket() {
      socket = io(BASE_URL);
      socket.on('presence', (peers) => {
        document.getElementById('onlineCount').textContent = peers.length;
      });
    }

    async function initPeer() {
      peer = new Peer(undefined, {
        host: 'ptt-1-zfyj.onrender.com',
        port: 443,
        path: '/peerjs',
        secure: true
      });

      peer.on('open', (id) => {
        myPeerId = id;
        console.log('✅ Peer ID:', id);
        socket.emit('register', { peerId: id, token: myToken });
        document.getElementById('status').textContent = '✅ Conectado - Peer OK';
      });

      peer.on('call', async (call) => {
        if (!localStream) localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        call.answer(localStream);
        handleRemoteStream(call);
      });
    }

    async function loadContacts() {
      try {
        const res = await fetch(`${BASE_URL}/contacts`, {
          headers: { Authorization: `Bearer ${myToken}` }
        });
        const contacts = await res.json();

        const list = document.getElementById('contactsList');
        list.innerHTML = '';

        contacts.forEach(contact => {
          const li = document.createElement('li');
          li.innerHTML = `
            ${contact.name} <strong>(${contact.id})</strong><br>
            <button onclick="startPTT('${contact.id}')" style="background:#0066ff; color:white;">
              🎤 Pressionar para Falar
            </button>
          `;
          list.appendChild(li);
        });

      } catch (e) {
        console.error(e);
        document.getElementById('status').innerHTML = 'Erro ao carregar contatos';
      }
    }

    async function startPTT(contactId) {
      document.getElementById('status').textContent = `Chamando ${contactId}...`;

      try {
        if (!localStream) {
          localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          console.log("✅ Microfone liberado");
        }

        const call = peer.call(contactId, localStream);
        handleRemoteStream(call);

      } catch (err) {
        console.error(err);
        alert("Não foi possível acessar o microfone. Verifique as permissões.");
      }
    }

    function handleRemoteStream(call) {
      call.on('stream', (remoteStream) => {
        const audio = new Audio();
        audio.srcObject = remoteStream;
        audio.play();
        document.getElementById('status').textContent = '🔊 Escutando áudio...';
      });
    }

    async function addContact() {
      const name = document.getElementById('contactName').value;
      const id = document.getElementById('contactId').value;

      if (!name || !id) return alert("Preencha nome e ID");

      await fetch(`${BASE_URL}/contacts`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${myToken}`
        },
        body: JSON.stringify({ name, id })
      });

      loadContacts();
    }

    // Inicia tudo quando carregar a página
    window.onload = initApp;
  </script>
</body>
</html>
