<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radio PTT</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #111; color: #0f0; text-align: center; }
    h1 { color: #0f0; }
    button { padding: 15px 30px; margin: 10px; font-size: 18px; border: none; border-radius: 8px; cursor: pointer; }
    .ptt-btn {
      background: red;
      color: white;
      font-size: 24px;
      padding: 30px 60px;
      border-radius: 50%;
      width: 200px;
      height: 200px;
    }
    .ptt-btn:active { background: darkred; transform: scale(0.95); }
    .status { margin: 15px; font-size: 18px; }
  </style>
</head>
<body>
  <h1>🚀 Radio PTT</h1>

  <div id="loginScreen">
    <h2>Login</h2>
    <input id="userId" placeholder="User ID" value="admin"><br><br>
    <input id="password" type="password" placeholder="Senha" value="123456"><br><br>
    <button onclick="login()">Entrar</button>
  </div>

  <div id="mainScreen" style="display:none;">
    <h2>Bem-vindo, <span id="userName"></span></h2>
    
    <div class="status" id="status">Status: Conectado</div>

    <h3>Adicionar Contato</h3>
    <input id="contactName" placeholder="Nome do contato">
    <input id="contactId" placeholder="ID do usuário">
    <button onclick="addContact()">Adicionar</button>

    <h3>Meus Contatos</h3>
    <ul id="contactsList"></ul>

    <h3>Online: <span id="onlineCount">0</span></h3>
  </div>

  <script>
    const BASE_URL = 'https://ptt-1-zfyj.onrender.com';
    let socket, peer, myToken, myUserId, myPeerId;
    let currentCall = null;
    let localStream = null;
    let isTalking = false;

    async function login() {
      const userId = document.getElementById('userId').value;
      const password = document.getElementById('password').value;

      const res = await fetch(`${BASE_URL}/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId, password })
      });

      const data = await res.json();
      if (!data.success) return alert(data.error || 'Erro no login');

      myToken = data.token;
      myUserId = userId;
      document.getElementById('userName').textContent = data.user.name;
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('mainScreen').style.display = 'block';

      initSocket();
      initPeer();
      loadContacts();
    }

    function initSocket() {
      socket = io(BASE_URL);
      socket.on('presence', (peers) => {
        document.getElementById('onlineCount').textContent = peers.length;
      });
    }

    async function initPeer() {
      peer = new Peer(undefined, {
        host: 'ptt-1-zfyj.onrender.com',
        port: 443,
        path: '/peerjs',
        secure: true,
        debug: 2
      });

      peer.on('open', (id) => {
        myPeerId = id;
        console.log('✅ Meu Peer ID:', id);
        socket.emit('register', { peerId: id, token: myToken });
      });

      peer.on('call', async (call) => {
        if (!localStream) {
          localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        }
        call.answer(localStream);
        handleCall(call);
      });

      peer.on('error', (err) => console.error('Peer Error:', err));
    }

    async function startCall(contactId) {
      if (!myPeerId) return alert("Aguardando conexão Peer...");

      try {
        if (!localStream) {
          localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        }

        const call = peer.call(contactId, localStream);  // Aqui usamos o Peer ID do contato
        handleCall(call);
        document.getElementById('status').textContent = `Chamando ${contactId}...`;
      } catch (err) {
        console.error(err);
        alert("Erro ao acessar microfone");
      }
    }

    function handleCall(call) {
      currentCall = call;
      call.on('stream', (remoteStream) => {
        const audio = new Audio();
        audio.srcObject = remoteStream;
        audio.play();
        document.getElementById('status').textContent = '🔊 Escutando...';
      });

      call.on('close', () => {
        document.getElementById('status').textContent = 'Chamada encerrada';
      });
    }

    // ==================== PTT (Pressionar para falar) ====================
    async function setupPTT(contactId) {
      const pttBtn = document.createElement('button');
      pttBtn.className = 'ptt-btn';
      pttBtn.textContent = 'PRESSIONE PARA FALAR';
      pttBtn.style.marginTop = '30px';

      // Pressionar
      pttBtn.addEventListener('mousedown', async () => {
        if (isTalking) return;
        isTalking = true;

        if (!localStream) {
          localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        }
        document.getElementById('status').textContent = '🗣️ Falando...';
      });

      // Soltar
      pttBtn.addEventListener('mouseup', () => {
        isTalking = false;
        document.getElementById('status').textContent = '🔊 Escutando...';
      });

      // Suporte para mobile
      pttBtn.addEventListener('touchstart', (e) => { e.preventDefault(); });
      pttBtn.addEventListener('touchend', (e) => { e.preventDefault(); });

      document.getElementById('mainScreen').appendChild(pttBtn);
    }

    // ==================== CONTATOS ====================
    async function loadContacts() {
      const res = await fetch(`${BASE_URL}/contacts`, {
        headers: { Authorization: `Bearer ${myToken}` }
      });
      const contacts = await res.json();
      renderContacts(contacts);
    }

    function renderContacts(contacts) {
      const list = document.getElementById('contactsList');
      list.innerHTML = '';

      contacts.forEach(contact => {
        const li = document.createElement('li');
        li.style.margin = '10px 0';
        li.innerHTML = `
          ${contact.name} (${contact.id})
          <button onclick="startCall('${contact.id}'); setupPTT('${contact.id}')" 
                  style="background:#0066ff; color:white; margin-left:10px;">
            Falar
          </button>
        `;
        list.appendChild(li);
      });
    }

    async function addContact() {
      const name = document.getElementById('contactName').value;
      const id = document.getElementById('contactId').value;

      if (!name || !id) return alert("Preencha todos os campos");

      await fetch(`${BASE_URL}/contacts`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${myToken}`
        },
        body: JSON.stringify({ name, id })
      });

      loadContacts();
    }

    function logout() {
      location.reload();
    }
  </script>
</body>
</html>
